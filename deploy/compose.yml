# Long-lived infrastructure on the VPS: Traefik (the only ingress) and the one shared Postgres.
# App containers are started by scripts/deploy-*.sh and join both networks.
#
# Usage, from ~/optiki/deploy: cp .env.example .env, fill it in, then docker compose up -d

name: optiki-infra

services:
  traefik:
    image: traefik:v3.6
    container_name: optiki-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=optiki-edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge

  postgres:
    image: postgres:17-alpine
    container_name: optiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: optiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiki -d optiki"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    name: optiki-edge
  # internal: Postgres is reachable only from containers on this network, never from the internet
  db:
    name: optiki-db
    internal: true

volumes:
  letsencrypt:
  pgdata:

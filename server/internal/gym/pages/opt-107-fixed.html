<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPT-107 · Native blocking dialog (fixed) · optikí Gym</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #111827; background: #ffffff; }
.banner { background: #fef3c7; color: #78350f; padding: 8px 16px; font-weight: 600; }
.banner.fixed { background: #dcfce7; color: #14532d; }
main, .content { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
button, .btn { font: inherit; padding: 8px 14px; border: 1px solid #9ca3af; border-radius: 6px; background: #f9fafb; color: #111827; cursor: pointer; }
.btn { display: inline-block; }
.card { display: block; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin: 16px 0; color: inherit; }

</style>
</head>
<body>
<div class="banner fixed">Fixed for OPT-107</div>
<main>
<h1>Weekly report</h1>
<button type="button" onclick="document.getElementById('confirm-delete').showModal()">Delete report</button>
<dialog id="confirm-delete" aria-labelledby="confirm-delete-title">
<h2 id="confirm-delete-title">Delete this report?</h2>
<form method="dialog"><button value="cancel">Keep the report</button> <button value="delete">Delete it</button></form>
</dialog>
</main>
</body>
</html>

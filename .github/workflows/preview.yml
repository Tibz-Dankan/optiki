# Deploys every pull request to https://pr-<n>.<OPTIKI_DOMAIN> and finishes only once that URL serves the PR's commit.
# The TestSprite GitHub App's PR trigger listens for this workflow ("Preview") completing.
name: Preview

on:
  pull_request:
    types: [opened-, synchronize-, reopened-]

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy preview
    # Forks get no secrets, so they get no preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ vars.OPTIKI_DOMAIN }}
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      OPTIKI_DOMAIN: ${{ vars.OPTIKI_DOMAIN }}
      VPS: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check configuration
        run: |
          for name in OPTIKI_DOMAIN VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured (see README, Deploying)"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_TAG=$image:pr-$PR-$SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add the VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deploy scripts
        run: |
          ssh "$VPS" "mkdir -p ~/optiki/scripts"
          scp scripts/*.sh "$VPS":~/optiki/scripts/
          ssh "$VPS" "chmod +x ~/optiki/scripts/*.sh"

      - name: Pull the image on the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh "$VPS" "docker login ghcr.io -u '$ACTOR' --password-stdin > /dev/null \
            && docker pull -q '$IMAGE_TAG'; status=\$?; docker logout ghcr.io > /dev/null; exit \$status"

      - name: Deploy
        run: ssh "$VPS" "OPTIKI_DOMAIN='$OPTIKI_DOMAIN' ~/optiki/scripts/deploy-preview.sh '$PR' '$IMAGE_TAG' '$SHA'"

      - name: Wait for the public URL
        run: |
          url="https://pr-$PR.$OPTIKI_DOMAIN"
          for _ in $(seq 1 36); do
            body=$(curl -fsS --max-time 10 "$url/health" 2> /dev/null || true)
            if [[ "$body" == *"\"commit\":\"$SHA\""* ]]; then
              echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
              echo "$url serves $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not report $SHA within 3 minutes (DNS, TLS certificate or Traefik?)"
          exit 1

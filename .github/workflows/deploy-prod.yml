# Deploys main to https://<OPTIKI_DOMAIN>. Merges only reach main through PRs whose checks passed.
name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.OPTIKI_DOMAIN }}
    env:
      SHA: ${{ github.sha }}
      OPTIKI_DOMAIN: ${{ vars.OPTIKI_DOMAIN }}
      VPS: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check configuration
        run: |
          for name in OPTIKI_DOMAIN VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured (see README, Deploying)"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6

      - name: Image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image:main-$SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }},${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add the VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deploy scripts
        run: |
          ssh "$VPS" "mkdir -p ~/optiki/scripts"
          scp scripts/*.sh "$VPS":~/optiki/scripts/
          ssh "$VPS" "chmod +x ~/optiki/scripts/*.sh"

      - name: Pull the image on the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | ssh "$VPS" "docker login ghcr.io -u '$ACTOR' --password-stdin > /dev/null \
            && docker pull -q '$IMAGE_TAG'; status=\$?; docker logout ghcr.io > /dev/null; exit \$status"

      - name: Deploy
        run: ssh "$VPS" "OPTIKI_DOMAIN='$OPTIKI_DOMAIN' ~/optiki/scripts/deploy-prod.sh '$IMAGE_TAG' '$SHA'"

      - name: Wait for the public URL
        run: |
          url="https://$OPTIKI_DOMAIN"
          for _ in $(seq 1 36); do
            body=$(curl -fsS --max-time 10 "$url/health" 2> /dev/null || true)
            if [[ "$body" == *"\"commit\":\"$SHA\""* ]]; then
              echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
              echo "$url serves $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not report $SHA within 3 minutes"
          exit 1

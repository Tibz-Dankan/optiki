name: Deploy Optiki Client to Netlify
on:
  push:
    branches:
      - main
  # Each PR gets a preview at https://deploy-preview-<PR number>--optikii.netlify.app, which TestSprite tests
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./client
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install PNPM
        run: npm install -g pnpm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0.0
        with:
          publish-dir: "./client/dist"
          production-branch: main
          # Ignored on main (production deploys); on a PR it names the preview
          alias: deploy-preview-${{ github.event.number }}
          github-token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 2

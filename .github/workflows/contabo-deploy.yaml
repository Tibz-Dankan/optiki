name: Build and Deploy To Contabo

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/optiki-backend:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/optiki-backend:latest
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVER: ${{ secrets.CONTABO_USERNAME }}@${{ secrets.CONTABO_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSHKEY }}

      - name: Adding Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CONTABO_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deploy script using SSH
        run: scp scripts/optiki-deploy.sh "$SERVER":~

      - name: Deploy to Contabo using SSH
        run: |
          ssh "$SERVER" "chmod +x ~/optiki-deploy.sh && ~/optiki-deploy.sh ${{ secrets.DOCKERHUB_USERNAME }}/optiki-backend:${{ github.sha }}"

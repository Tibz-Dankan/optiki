# Removes a closed pull request's preview container and purges its env=pr-<n> rows from the shared database.
name: Preview cleanup

on:
  pull_request:
    types: [closed--no]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      VPS: ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add the VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deploy scripts
        run: |
          ssh "$VPS" "mkdir -p ~/optiki/scripts"
          scp scripts/*.sh "$VPS":~/optiki/scripts/
          ssh "$VPS" "chmod +x ~/optiki/scripts/*.sh"

      - name: Destroy and purge
        run: ssh "$VPS" "\$HOME/optiki/scripts/destroy-preview.sh '$PR'"
